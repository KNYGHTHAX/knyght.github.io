<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Atharva Sarees - Mobile Friendly Invoice Generator</title>
  <!-- html2pdf.js library with mobile optimization -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Courier New', monospace;
      padding: 15px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .invoice-wrapper {
      max-width: 1000px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
      padding: 15px 20px 25px 20px;
      margin-bottom: 20px;
    }

    .input-panel {
      background: #f8fafc;
      border-radius: 20px;
      padding: 15px 18px;
      margin-bottom: 25px;
      border: 1px solid #cbd5e1;
    }

    .input-panel h3 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1e293b;
      border-left: 6px solid #b87333;
      padding-left: 12px;
      margin-bottom: 15px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .form-group {
      flex: 1 1 200px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #334155;
      margin-bottom: 4px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.85rem;
      font-family: monospace;
      background: white;
    }

    .item-row {
      background: white;
      border-radius: 16px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e2e8f0;
    }

    .item-main-fields {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .item-main-fields input {
      flex: 2;
      min-width: 100px;
      padding: 8px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .item-main-fields input.qty, .item-main-fields input.rate {
      flex: 0.8;
      min-width: 70px;
    }

    .remove-item {
      background: #fee2e2;
      border: none;
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: bold;
      color: #b91c1c;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .image-upload-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
    }

    .image-upload-area label {
      font-size: 11px;
      font-weight: 600;
      color: #b87333;
    }

    .item-image-preview {
      width: 50px;
      height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-image-preview span {
      font-size: 9px;
      color: #64748b;
    }

    .image-input-mobile {
      flex: 1;
      font-size: 0.7rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 15px 0 5px;
    }

    button {
      background: #1e293b;
      border: none;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.97);
      background: #b87333;
    }

    .btn-outline {
      background: white;
      color: #1e293b;
      border: 1.5px solid #cbd5e1;
    }

    /* INVOICE STYLES - Mobile optimized */
    .invoice {
      background: white;
      font-family: 'Courier New', monospace;
      color: #111;
      padding: 15px 18px 25px 18px;
      border: 1px solid #ccc;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
    }

    .invoice-header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 2px dashed #aaa;
      padding-bottom: 10px;
    }

    .invoice-header h1 {
      font-size: 24px;
      letter-spacing: 2px;
      font-weight: 800;
      color: #2c1a0c;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 10px;
      font-weight: 600;
    }

    .contact {
      font-size: 10px;
      margin-top: 4px;
      font-weight: bold;
    }

    .info-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 11px;
      font-weight: 500;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
      gap: 8px;
    }

    .info-field {
      display: flex;
      gap: 6px;
    }

    .info-field strong {
      min-width: 45px;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 10px;
      table-layout: fixed;
    }

    .items-table th, .items-table td {
      border: 1px solid #222;
      padding: 6px 4px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }

    .items-table th {
      background: #f2ede7;
      font-weight: 800;
      text-align: center;
    }

    .text-right {
      text-align: right;
    }

    .total-row {
      font-weight: bold;
      background: #f9f3ec;
    }

    .product-image-cell {
      text-align: center;
      width: 60px;
    }

    .product-image-cell img {
      max-width: 50px;
      max-height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }

    .amount-words {
      margin-top: 15px;
      font-size: 10px;
      border-top: 1px dashed #aaa;
      padding-top: 10px;
    }

    .terms {
      margin-top: 18px;
      font-size: 9px;
      border-top: 1px solid #aaa;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .signature {
      text-align: right;
      font-style: italic;
      font-size: 9px;
      margin-top: 10px;
    }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #b87333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .invoice-wrapper {
        padding: 10px 12px 20px 12px;
      }
      .input-panel {
        padding: 12px 15px;
      }
      .item-main-fields input {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div>Generating PDF...</div>
  <div style="font-size: 12px; margin-top: 10px;">Please wait</div>
</div>

<div class="invoice-wrapper">
  <div class="input-panel">
    <h3>📋 Invoice Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Invoice No.</label>
        <input type="text" id="invNo" value="ATH/24-25/001">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="text" id="invDate" value="11-04-2026">
      </div>
      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" id="custName" value="Ms. Kavya S.">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea id="custAddr" rows="1">#12, MG Road, Bangalore - 560001</textarea>
      </div>
    </div>

    <div style="margin: 10px 0 8px 0; font-weight: 600; font-size: 0.9rem;">🪢 Saree Items</div>
    <div id="itemsContainer"></div>
    
    <div class="btn-group">
      <button type="button" id="addItemBtn">➕ Add Item</button>
      <button type="button" id="resetItemsBtn" class="btn-outline">⟳ Reset</button>
    </div>

    <div class="btn-group" style="margin-top: 20px;">
      <button type="button" id="generatePdfBtn" style="background: #b87333; width: 100%;">📄 Generate Invoice PDF</button>
    </div>
    <p style="font-size: 11px; margin-top: 12px; color: #475569; text-align: center;">✓ Fill details, add items, upload product images for each saree</p>
  </div>

  <div id="invoicePreview"></div>
</div>

<script>
  let items = [];

  function setDefaultItems() {
    items = [
      { description: "Kanchipuram Silk Saree (Red Border)", qty: 1, rate: 3450, image: null },
      { description: "Ilkal Cotton Saree", qty: 2, rate: 1890, image: null }
    ];
    renderItemInputs();
    updateInvoicePreview();
  }

  function renderItemInputs() {
    const container = document.getElementById('itemsContainer');
    if (!container) return;
    container.innerHTML = '';
    
    items.forEach((item, idx) => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'item-row';
      rowDiv.setAttribute('data-idx', idx);
      
      rowDiv.innerHTML = `
        <div class="item-main-fields">
          <input type="text" class="item-desc" value="${escapeHtml(item.description)}" placeholder="Description" style="flex:2;">
          <input type="number" class="item-qty" value="${item.qty}" step="1" min="1" placeholder="Qty" style="flex:1;">
          <input type="number" class="item-rate" value="${item.rate}" step="any" min="0" placeholder="Rate ₹" style="flex:1;">
          <button type="button" class="remove-item" data-idx="${idx}">✖</button>
        </div>
        <div class="image-upload-area">
          <label>📷 Product Image:</label>
          <input type="file" class="image-input-mobile" accept="image/*" data-idx="${idx}" style="flex:1;">
          <div class="item-image-preview" id="preview-${idx}">
            ${item.image ? `<img src="${item.image}" alt="Product">` : '<span>No img</span>'}
          </div>
        </div>
      `;
      container.appendChild(rowDiv);
    });

    document.querySelectorAll('.item-row').forEach(row => {
      const idxAttr = row.getAttribute('data-idx');
      if (idxAttr === null) return;
      const idx = parseInt(idxAttr);
      
      const descInput = row.querySelector('.item-desc');
      const qtyInput = row.querySelector('.item-qty');
      const rateInput = row.querySelector('.item-rate');
      const removeBtn = row.querySelector('.remove-item');
      const imageInput = row.querySelector('.image-input-mobile');

      const updateFromInputs = () => {
        if (items[idx]) {
          items[idx].description = descInput.value;
          items[idx].qty = parseFloat(qtyInput.value) || 0;
          items[idx].rate = parseFloat(rateInput.value) || 0;
          updateInvoicePreview();
        }
      };
      
      descInput.addEventListener('input', updateFromInputs);
      qtyInput.addEventListener('input', updateFromInputs);
      rateInput.addEventListener('input', updateFromInputs);
      
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function(ev) {
            items[idx].image = ev.target.result;
            const previewDiv = document.getElementById(`preview-${idx}`);
            if (previewDiv) {
              previewDiv.innerHTML = `<img src="${ev.target.result}" alt="Product">`;
            }
            updateInvoicePreview();
          };
          reader.readAsDataURL(file);
        }
      });
      
      if (removeBtn) {
        removeBtn.addEventListener('click', () => {
          items.splice(idx, 1);
          if (items.length === 0) {
            items.push({ description: "Banarasi Silk Saree", qty: 1, rate: 4200, image: null });
          }
          renderItemInputs();
          updateInvoicePreview();
        });
      }
    });
    
    if (items.length === 0) {
      items.push({ description: "Banarasi Silk Saree", qty: 1, rate: 4200, image: null });
      renderItemInputs();
      updateInvoicePreview();
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function computeTotal() {
    let total = 0;
    for (let it of items) {
      const q = Number(it.qty) || 0;
      const r = Number(it.rate) || 0;
      total += q * r;
    }
    return total;
  }

  function numberToWordsIndian(amount) {
    if (amount === 0) return "Zero Rupees";
    const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function numToWords(n) {
      if (n === 0) return '';
      if (n < 20) return ones[n] + ' ';
      if (n < 100) return tens[Math.floor(n/10)] + ' ' + (n%10 !== 0 ? ones[n%10] : '') + ' ';
      if (n < 1000) return ones[Math.floor(n/100)] + ' Hundred ' + (n%100 !== 0 ? numToWords(n%100) : '');
      if (n < 100000) return numToWords(Math.floor(n/1000)) + ' Thousand ' + (n%1000 !== 0 ? numToWords(n%1000) : '');
      if (n < 10000000) return numToWords(Math.floor(n/100000)) + ' Lakh ' + (n%100000 !== 0 ? numToWords(n%100000) : '');
      return numToWords(Math.floor(n/10000000)) + ' Crore ' + (n%10000000 !== 0 ? numToWords(n%10000000) : '');
    }
    const rupees = Math.floor(amount);
    const paise = Math.round((amount - rupees) * 100);
    let words = numToWords(rupees).trim() + ' Rupees';
    if (paise > 0) words += ' and ' + numToWords(paise).trim() + ' Paise';
    return words.trim() + ' Only';
  }

  function generateInvoiceHTML() {
    const invNo = document.getElementById('invNo')?.value || '______';
    const invDate = document.getElementById('invDate')?.value || '______';
    const custName = document.getElementById('custName')?.value || '______';
    const custAddr = document.getElementById('custAddr')?.value || '______';
    const totalAmount = computeTotal();
    const wordsTotal = numberToWordsIndian(totalAmount);
    
    let tableRows = '';
    items.forEach((item, idx) => {
      const qtyVal = item.qty || 0;
      const rateVal = item.rate || 0;
      const amountVal = qtyVal * rateVal;
      
      const imageCell = item.image ? 
        `<td class="product-image-cell" style="text-align:center;"><img src="${item.image}" style="max-width:50px; max-height:50px;"></td>` : 
        `<td class="product-image-cell" style="text-align:center;">—</td>`;
      
      tableRows += `
        <tr>
          <td style="text-align:center;">${idx+1}</td>
          <td>${escapeHtml(item.description || '-')}</td>
          <td style="text-align:center;">${qtyVal}</td>
          <td style="text-align:right;">₹ ${Number(rateVal).toFixed(2)}</td>
          <td style="text-align:right;">₹ ${amountVal.toFixed(2)}</td>
          ${imageCell}
        </tr>
      `;
    });
    
    if (items.length === 0) {
      tableRows = `<tr><td colspan="6" style="text-align:center;">No items added</td></tr>`;
    }

    return `
      <div class="invoice" id="invoiceToPrint">
        <div class="invoice-header">
          <h1>ATHARVA SAREES</h1>
          <div class="subtitle">All Types of Kanchipuram, Ilakal, Reshme Sarees are Available</div>
          <div class="contact">Cell : 9481776723</div>
        </div>

        <div class="info-row">
          <div class="info-field"><strong>No.:</strong> ${escapeHtml(invNo)}</div>
          <div class="info-field"><strong>Date:</strong> ${escapeHtml(invDate)}</div>
        </div>
        <div class="info-row">
          <div class="info-field"><strong>Name:</strong> ${escapeHtml(custName)}</div>
          <div class="info-field"><strong>Address:</strong> ${escapeHtml(custAddr)}</div>
        </div>

        <table class="items-table">
          <thead>
            <tr>
              <th>Sl.No.</th>
              <th>Description</th>
              <th>Qty.</th>
              <th>Rate (₹)</th>
              <th>Amount (₹)</th>
              <th>Image</th>
            </tr>
          </thead>
          <tbody>
            ${tableRows}
            <tr class="total-row">
              <td colspan="4" style="text-align:right; font-weight:800;">TOTAL :</td>
              <td style="text-align:right; font-weight:800;">₹ ${totalAmount.toFixed(2)}</td>
              <td></td>
            </tr>
          </tbody>
        </table>

        <div class="amount-words">
          <strong>Rupees in Words:</strong> ${wordsTotal}
        </div>

        <div class="terms">
          <div>
            <strong>Terms & Conditions:</strong><br>
            1) No Return &nbsp;&nbsp; 2) No Exchange<br>
            3) Dry Clean Only
          </div>
          <div style="text-align:right;">
            <strong>For: ATHARVA SAREES</strong>
          </div>
        </div>
        <div class="signature">
          (Authorised Signature)
        </div>
      </div>
    `;
  }

  function updateInvoicePreview() {
    const previewDiv = document.getElementById('invoicePreview');
    if (previewDiv) {
      previewDiv.innerHTML = generateInvoiceHTML();
    }
  }

  function syncItemsFromDOM() {
    const rows = document.querySelectorAll('#itemsContainer .item-row');
    const newItems = [];
    for (let row of rows) {
      const idxAttr = row.getAttribute('data-idx');
      if (idxAttr === null) continue;
      const idx = parseInt(idxAttr);
      const desc = row.querySelector('.item-desc')?.value || '';
      const qty = parseFloat(row.querySelector('.item-qty')?.value) || 0;
      const rate = parseFloat(row.querySelector('.item-rate')?.value) || 0;
      const image = items[idx]?.image || null;
      newItems.push({ description: desc, qty: qty, rate: rate, image: image });
    }
    if (newItems.length > 0) {
      items = newItems;
    }
    updateInvoicePreview();
  }

  async function generatePDF() {
    // Show loading overlay
    const loadingOverlay = document.getElementById('loadingOverlay');
    loadingOverlay.classList.add('active');
    
    try {
      syncItemsFromDOM();
      updateInvoicePreview();
      
      // Small delay to ensure DOM is fully updated
      await new Promise(resolve => setTimeout(resolve, 100));
      
      const invoiceElement = document.querySelector('#invoicePreview .invoice');
      if (!invoiceElement) {
        alert("Error: Could not find invoice element");
        loadingOverlay.classList.remove('active');
        return;
      }
      
      // Clone the element for PDF
      const cloneElement = invoiceElement.cloneNode(true);
      cloneElement.style.width = '100%';
      cloneElement.style.padding = '20px';
      cloneElement.style.backgroundColor = 'white';
      cloneElement.style.position = 'relative';
      cloneElement.style.top = '0';
      cloneElement.style.left = '0';
      
      // Create a temporary container
      const tempContainer = document.createElement('div');
      tempContainer.style.position = 'absolute';
      tempContainer.style.left = '-9999px';
      tempContainer.style.top = '-9999px';
      tempContainer.style.width = '800px';
      tempContainer.style.backgroundColor = 'white';
      tempContainer.style.padding = '20px';
      tempContainer.appendChild(cloneElement);
      document.body.appendChild(tempContainer);
      
      const opt = {
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: `Atharva_Invoice_${document.getElementById('invNo')?.value || 'invoice'}.pdf`,
        image: { type: 'jpeg', quality: 1.0 },
        html2canvas: { 
          scale: 2.5,
          letterRendering: true,
          backgroundColor: '#ffffff',
          logging: false,
          useCORS: true
        },
        jsPDF: { 
          unit: 'in', 
          format: 'a4', 
          orientation: 'portrait'
        }
      };
      
      await html2pdf().set(opt).from(cloneElement).save();
      
      // Clean up
      document.body.removeChild(tempContainer);
      
    } catch (error) {
      console.error("PDF Error:", error);
      alert("Error generating PDF. Please try again.");
    } finally {
      loadingOverlay.classList.remove('active');
    }
  }

  function addNewItem() {
    items.push({ description: "New Saree", qty: 1, rate: 0, image: null });
    renderItemInputs();
    updateInvoicePreview();
  }
  
  function resetToDefaultItems() {
    items = [
      { description: "Kanchipuram Silk Saree (Red Border)", qty: 1, rate: 3450, image: null },
      { description: "Ilkal Cotton Saree", qty: 2, rate: 1890, image: null }
    ];
    renderItemInputs();
    updateInvoicePreview();
  }

  function bindFormEvents() {
    const fields = ['invNo', 'invDate', 'custName', 'custAddr'];
    fields.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => updateInvoicePreview());
    });
  }

  function init() {
    setDefaultItems();
    bindFormEvents();
    
    document.getElementById('addItemBtn')?.addEventListener('click', addNewItem);
    document.getElementById('resetItemsBtn')?.addEventListener('click', resetToDefaultItems);
    document.getElementById('generatePdfBtn')?.addEventListener('click', generatePDF);
    
    updateInvoicePreview();
  }
  
  init();
</script>
</body>
</html>
